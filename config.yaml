# config.yaml

# --- General Settings ---
use_gpu: false # Master switch to enable GPU acceleration for supported models (lgbm, xgb)
data_source: csv # "mt5" or "csv". Automatically switches to csv on non-windows

# --- Optuna Tuning Specifics ---
optuna_n_trials: 150  # 150
optuna_pruning_interval: 100 # New: Interval for Optuna pruning checks
n_jobs: -1 # Number of parallel jobs for tuning. -1 means all available CPU cores.
roc_lags_options:
  - [1, 3, 5, 10]
  - [1, 2, 4, 8]
  - [2, 5, 10, 15]
  - [1, 2, 3]

# --- ML & CV Settings ---
cv_samples_per_split: 300 # Affects number of splits in TimeSeriesSplit. Higher -> fewer splits -> faster but less robust CV.

# --- Symbols & timeframe ---
# historical_data symbols for .csv needed: M5-EURUSD#, H1-EURUSD#, and M5-USDX-DEC25
symbols: ["USDJPY#"] #"EURUSD#", "GBPUSD#", "USDJPY#", "USDX-DEC25"
timeframe: "M5"            # One of: M1, M5, M15, M30, H1, H4
history_bars: 36000          # How many bars to pull when (re)starting #6048 18000 36000  105,000 bars (for one year of M5 data)
retrain_every_bars: 250     # Incremental retrain every N bars
prediction_horizon: 6       # 6 Bars ahead for label (~30 min on M5)

# --- Features (now tunable) ---
features:
  rsi_period: [10, 25]
  ema_fast: [5, 15]
  ema_slow: [20, 40]
  window_vol: [15, 30]
  adx_period: [10, 25]
  adx_trend_thresh: [20, 30]

# --- Context Features (static, not tuned by optuna) ---
context_features:
  mta:
    enabled: true
    timeframe: "H1"
    ema_period: 50
    rsi_period: 14
  inter_market:
    enabled: true
    symbol: "USDX-DEC25" # Make sure this symbol is available in your data source
    roc_lags: [5, 21, 63]
  price_action:
    enabled: true
    home_base_ma_period: 200
    swing_lookback: 50

# --- Base learners / models ---
# For live bot: after tuning, Optuna best parameters overwrite these
# For tuning: these ranges are used by Optuna
models:
  - name: lgbm
    params: 
      # Tunable ranges for Optuna
      n_estimators: [100, 500]       # min, max
      learning_rate: [0.01, 0.1, "log"]
      max_depth: [3, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  - name: xgb
    params:
      n_estimators: [100, 500]
      learning_rate: [0.01, 0.1, "log"]
      max_depth: [3, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  - name: rf
    params:
      n_estimators: [100, 500]
      max_depth: [3, 12]
      min_samples_leaf: [1, 5]

  - name: logreg
    params: {}  # default logistic regression

ensemble:
  method: soft_vote
  threshold_metric: sharpe_ratio # custom_pnl # sharpe_ratio
  threshold_grid: auto
  min_ensemble_auc: 0.55        # Minimum AUC required to allow trading
  auto_threshold: true           # Auto-adjust thresholds based on historical PnL

# --- Trading costs & execution ---
trading_costs:
  source: static
  defaults:
    spread_pips: 0.8
    slippage_pips: 0.5
    commission_per_trade: 0.0
    lot_size: 0.1
    pip_value: 0.0001
    adaptive_slippage: true        # dynamically calculate slippage based on recent spread
    retry_order_send: 3            # number of retries for failed order sends

# --- Risk management ---
risk:
  dynamic_risk:
    enabled: true
    base_risk: 0.0025      # Risk when model confidence is at its lowest (e.g., 0.25%)
    max_risk: 0.01         # Max risk when confidence is highest (e.g., 1.0%)
    auc_floor: 0.55        # The AUC score that corresponds to base_risk
    auc_ceiling: 0.65      # The AUC score that corresponds to max_risk

  dynamic_tp:
    enabled: true
    base_tp_mult: 1.8     # ATR multiplier for TP at lowest confidence
    max_tp_mult: 2.5       # ATR multiplier for TP at highest confidence
    auc_floor: 0.55        # Same AUC floor as risk
    auc_ceiling: 0.65      # Same AUC ceiling as risk

  max_positions: 3               # Max concurrent positions
  max_portfolio_risk: 0.03       # Total equity risk cap
  atr_multiplier_sl: 1.5
  atr_multiplier_tp: 2.5
  breakeven_at_1R: true
  trailing_atr_mult: 1.0
  min_prob_long: 0.55
  min_prob_short: 0.55
  block_on_drawdown: 1.0         # 0.1 pause if drawdown from equity peak exceeds 10%     #disable 1.0
  min_auc_improvement: 0.005     # 0.005 default # minimum improvement in AUC to accept a new model
  max_drawdown_for_pruning: 1.0   # 0.40: Max drawdown allowed before Optuna trial pruning  #disable 1.0
  session_filter:
    start: "00:00"
    end: "23:59"
    # start: "07:00"
    # end: "22:00"

# --- Logging ---
logging:
  level: INFO
  to_file: true
  rotate: 10 MB
  retention: 7 days

# --- Re-optimization Triggers ---
reoptimization_triggers:
  enabled: true
  check_interval_minutes: 60 # How often to check performance triggers
  lookback_days: 30          # Period over which to calculate performance metrics
  min_sharpe_ratio: 0.5      # If live Sharpe drops below this, trigger re-opt
  max_drawdown_percent: 0.20 # If live drawdown exceeds this, trigger re-opt
  min_ensemble_auc: 0.55     # If average ensemble AUC drops below this, trigger re-opt

# --- Monitoring / Safety ---
watchdog:
  max_consecutive_losses: 0      # 5 Stop trading if more than N losses in a row    #disable 0
  cooldown_hours: 0.0              # 1 Pause trading for X hours if triggered       #disable 0.0

# --- Monitoring ---
monitoring:
  monitor_state_file: "monitor_state.json" # File to save LivePerformanceMonitor state
  telegram_bot_token: "8063675444:AAFloolk3KYXs0SGpGRwiCILGpH6c1q3ep4" # Your Telegram Bot Token
  telegram_chat_id: "-4809426556" # Your Telegram Chat ID (can be negative for groups)

# --- Misc / Transparency ---
startup_logging: true             # log key settings at bot launch for transparency