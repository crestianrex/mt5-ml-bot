# --- Symbols & timeframe ---
# symbols: ["EURGBP#", "EURJPY#", "EURUSD#", "GBPUSD#", "USDCAD#", "USDCHF#", "USDJPY#", "AUDUSD#"]
symbols: ["EURGBP#", "EURJPY#"]
timeframe: "M5"            # One of: M1, M5, M15, M30, H1, H4
history_bars: 500          # How many bars to pull when (re)starting
retrain_every_bars: 250     # Incremental retrain every N bars
prediction_horizon: 6       # Bars ahead for label (~30 min on M5)

# --- Features Config ---
# For FULL HYPERPARAMETER TUNING (features + models) using the tuning scripts,
# comment out the fixed values below and uncomment the tuning ranges.
# For normal BACKTESTING or LIVE TRADING, use the fixed values below.
features:
  # --- Fixed values for backtesting/live trading ---
  rsi_period: 14
  ema_fast: 12
  ema_slow: 26
  window_vol: 20
  adx_period: 14
  adx_trend_thresh: 25

  # --- Ranges for tuning ---
  # rsi_period: [10, 25]
  # ema_fast: [5, 15]
  # ema_slow: [20, 40]
  # window_vol: [15, 30]
  # adx_period: [10, 25]
  # adx_trend_thresh: [20, 30]
  
  # --- Not currently tuned ---
  roc_lags: [1, 3, 5, 10]

# --- Base learners / models ---
models:
  - name: lgbm
    params: 
      n_estimators: [100, 500]
      learning_rate: [0.01, 0.1, "log"]
      max_depth: [3, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  - name: xgb
    params:
      n_estimators: [100, 500]
      learning_rate: [0.01, 0.1, "log"]
      max_depth: [3, 10]
      subsample: [0.6, 1.0]
      colsample_bytree: [0.6, 1.0]

  - name: rf
    params:
      n_estimators: [100, 500]
      max_depth: [3, 12]
      min_samples_leaf: [1, 5]

  - name: logreg
    params: {}  # default logistic regression

# --- Ensemble settings ---
ensemble:
  method: stacking
  weights: {lgbm: 0.35, xgb: 0.35, rf: 0.2, logreg: 0.1}
  meta: {type: "logit", C: 1.0}

# --- Risk management ---
risk:
  dynamic_risk:
    enabled: true
    base_risk: 0.0025
    max_risk: 0.01
    auc_floor: 0.55
    auc_ceiling: 0.65

  dynamic_tp:
    enabled: true
    base_tp_mult: 1.8
    max_tp_mult: 2.5
    auc_floor: 0.55
    auc_ceiling: 0.65

  max_positions: 3
  atr_multiplier_sl: 1.5
  breakeven_at_1R: true
  trailing_atr_mult: 1.0
  min_prob_long: 0.55
  min_prob_short: 0.55
  block_on_drawdown: 0.1
  transaction_cost_pips: 1.5
  session_filter:
    start: "07:00"
    end: "22:00"
  min_ensemble_auc: 0.55

# --- Logging ---
logging:
  level: INFO
  to_file: true
  rotate: 10 MB
  retention: 7 days
